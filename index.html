<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Signal Tool</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b110d;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .card-container {
            background-color: #111a14;
            border: 1px solid #1a291f;
            border-radius: 14px;
            width: 100%;
            max-width: 290px;
            padding: 18px 14px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-title {
            color: #00e676;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #ff5252;
            font-weight: 600;
        }

        .status-badge.connected {
            color: #00e676;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .symbol-select {
            width: 100%;
            background-color: #0b110d;
            color: #cccccc;
            border: 1px solid #1a291f;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.75rem;
            margin-bottom: 12px;
            text-align: center;
            outline: none;
            cursor: pointer;
        }

        .symbol-select:focus {
            border-color: #00e676;
        }

        .digit-circle {
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #29b6f6 0%, #0288d1 100%);
            border-radius: 50%;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(2, 136, 209, 0.4);
        }

        .confidence-text {
            color: #ffb300;
            font-size: 1.05rem;
            font-weight: 700;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .action-banner {
            color: #00e676;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header">
            <span class="brand-title">Deriv Pro Tool</span>
            <div class="status-badge" id="statusBadge">
                <span class="pulse-dot"></span> <span id="statusText">CONNECTING</span>
            </div>
        </div>

        <!-- Interactive Market Selector -->
        <select class="symbol-select" id="symbolSelect">
            <option value="1HZ10V" selected>Volatility 10 (1s) Index</option>
            <option value="R_10">Volatility 10 Index</option>
            <option value="1HZ25V">Volatility 25 (1s) Index</option>
            <option value="R_25">Volatility 25 Index</option>
            <option value="1HZ50V">Volatility 50 (1s) Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="1HZ75V">Volatility 75 (1s) Index</option>
            <option value="R_75">Volatility 75 Index</option>
            <option value="1HZ100V">Volatility 100 (1s) Index</option>
            <option value="R_100">Volatility 100 Index</option>
        </select>

        <div class="digit-circle" id="digitDisplay">-</div>

        <div class="confidence-text" id="confidenceDisplay">Confidence: --%</div>

        <div class="action-banner" id="timerDisplay">WAITING FOR TICKS</div>
    </div>

    <script>
        const app_id = 1089;
        const maxHistory = 100;
        let tickHistory = [];
        let ws = null;
        let currentSubscriptionId = null;

        const digitEl = document.getElementById('digitDisplay');
        const confidenceEl = document.getElementById('confidenceDisplay');
        const timerEl = document.getElementById('timerDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const symbolSelect = document.getElementById('symbolSelect');

        function connectWebSocket() {
            ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${app_id}`);

            ws.onopen = () => {
                statusBadge.classList.add('connected');
                statusText.textContent = 'LIVE';
                subscribeToSymbol(symbolSelect.value);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.error) {
                    console.error("Deriv API Error:", data.error);
                    timerEl.textContent = `ERR: ${data.error.code}`;
                    return;
                }

                // Capture subscription ID
                if (data.subscription) {
                    currentSubscriptionId = data.subscription.id;
                }

                // Process streaming ticks safely
                if (data.msg_type === 'tick' && data.tick) {
                    const pipSize = data.tick.pip_size ?? 2;
                    const quote = Number(data.tick.quote).toFixed(pipSize);
                    const lastDigit = parseInt(quote.slice(-1));

                    tickHistory.push(lastDigit);
                    if (tickHistory.length > maxHistory) {
                        tickHistory.shift();
                    }

                    const confidence = calculateConfidence(lastDigit);

                    digitEl.textContent = lastDigit;
                    confidenceEl.textContent = `Confidence: ${confidence}%`;
                    timerEl.textContent = `ANALYZING (${tickHistory.length}/${maxHistory})`;
                }
            };

            ws.onerror = (err) => {
                statusBadge.classList.remove('connected');
                statusText.textContent = 'OFFLINE';
                timerEl.textContent = 'CONN ERROR';
            };

            ws.onclose = () => {
                statusBadge.classList.remove('connected');
                statusText.textContent = 'CLOSED';
            };
        }

        function subscribeToSymbol(symbol) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            // Reset UI
            tickHistory = [];
            digitEl.textContent = '-';
            confidenceEl.textContent = 'Confidence: --%';
            timerEl.textContent = 'SUBSCRIBING...';

            // Unsubscribe from previous market stream
            if (currentSubscriptionId) {
                ws.send(JSON.stringify({ forget: currentSubscriptionId }));
                currentSubscriptionId = null;
            }

            // Send tick subscription request with 'subscribe: 1'
            ws.send(JSON.stringify({
                ticks: symbol,
                subscribe: 1
            }));
        }

        // Change symbol on dropdown select
        symbolSelect.addEventListener('change', (e) => {
            subscribeToSymbol(e.target.value);
        });

        // Start connection
        connectWebSocket();

        function calculateConfidence(currentDigit) {
            if (tickHistory.length < 10) return 50;
            const occurrences = tickHistory.filter(d => d === currentDigit).length;
            const ratio = occurrences / tickHistory.length;
            return Math.min(Math.round(ratio * 400 + 40), 95);
        }
    </script>
</body>
</html>
