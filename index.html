<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Live Tool</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b110d;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .card-container {
            background-color: #111a14;
            border: 1px solid #1a291f;
            border-radius: 14px;
            width: 100%;
            max-width: 290px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .brand-title {
            color: #00e676;
            font-size: 1rem;
            font-weight: 700;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #ff5252;
            font-weight: 700;
        }

        .status-badge.connected {
            color: #00e676;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .symbol-select {
            width: 100%;
            background-color: #0b110d;
            color: #ffffff;
            border: 1px solid #1a291f;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        .symbol-select:focus {
            border-color: #00e676;
        }

        .digit-circle {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #29b6f6 0%, #0288d1 100%);
            border-radius: 50%;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 4px 25px rgba(2, 136, 209, 0.5);
        }

        .confidence-text {
            color: #ffb300;
            font-size: 1.15rem;
            font-weight: 800;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .action-banner {
            color: #00e676;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header">
            <span class="brand-title">Deriv Pro Tool</span>
            <div class="status-badge" id="statusBadge">
                <span class="pulse-dot"></span> <span id="statusText">CONNECTING</span>
            </div>
        </div>

        <!-- 100% Publicly Available Symbols -->
        <select class="symbol-select" id="symbolSelect">
            <option value="R_10" selected>Volatility 10 Index</option>
            <option value="R_25">Volatility 25 Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="R_75">Volatility 75 Index</option>
            <option value="R_100">Volatility 100 Index</option>
        </select>

        <div class="digit-circle" id="digitDisplay">-</div>

        <div class="confidence-text" id="confidenceDisplay">Confidence: --%</div>

        <div class="action-banner" id="timerDisplay">WAITING FOR DATA</div>
    </div>

    <script>
        const app_id = 1089;
        const maxHistory = 100;
        let tickHistory = [];
        let ws = null;
        let currentSubscriptionId = null;

        const digitEl = document.getElementById('digitDisplay');
        const confidenceEl = document.getElementById('confidenceDisplay');
        const timerEl = document.getElementById('timerDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const symbolSelect = document.getElementById('symbolSelect');

        function connectWebSocket() {
            // Establish fresh connection to Deriv
            ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${app_id}`);

            ws.onopen = () => {
                statusBadge.classList.add('connected');
                statusText.textContent = 'LIVE';
                // Trigger initial subscription
                subscribeToSymbol(symbolSelect.value);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                // Handle API errors gracefully
                if (data.error) {
                    console.error("Deriv API Error:", data.error.message);
                    timerEl.textContent = `ERR: ${data.error.code}`;
                    timerEl.style.color = "#ff5252";
                    return;
                }

                // Save active subscription ID so we can cancel it later when switching markets
                if (data.subscription) {
                    currentSubscriptionId = data.subscription.id;
                }

                // Process successful live tick
                if (data.msg_type === 'tick' && data.tick) {
                    // Reset text color in case of previous error
                    timerEl.style.color = "#00e676"; 
                    
                    const pipSize = data.tick.pip_size ?? 2;
                    const quote = Number(data.tick.quote).toFixed(pipSize);
                    
                    // Extract the absolute last digit
                    const lastDigit = parseInt(quote.slice(-1));

                    // Store history and calculate
                    tickHistory.push(lastDigit);
                    if (tickHistory.length > maxHistory) {
                        tickHistory.shift();
                    }

                    const confidence = calculateConfidence(lastDigit);

                    // Update UI immediately
                    digitEl.textContent = lastDigit;
                    confidenceEl.textContent = `Confidence: ${confidence}%`;
                    timerEl.textContent = `ANALYZING (${tickHistory.length}/${maxHistory})`;
                }
            };

            ws.onerror = () => {
                statusBadge.classList.remove('connected');
                statusText.textContent = 'OFFLINE';
                timerEl.textContent = 'CONN ERROR';
                timerEl.style.color = "#ff5252";
            };

            ws.onclose = () => {
                statusBadge.classList.remove('connected');
                statusText.textContent = 'CLOSED';
                timerEl.textContent = 'RECONNECTING...';
                // Auto-reconnect after 3 seconds if connection drops
                setTimeout(connectWebSocket, 3000);
            };
        }

        function subscribeToSymbol(symbol) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            // Reset UI for new market
            tickHistory = [];
            digitEl.textContent = '-';
            confidenceEl.textContent = 'Confidence: --%';
            timerEl.textContent = 'SUBSCRIBING...';

            // Forget previous market stream if it exists
            if (currentSubscriptionId) {
                ws.send(JSON.stringify({ forget: currentSubscriptionId }));
                currentSubscriptionId = null;
            }

            // Request new stream
            ws.send(JSON.stringify({
                ticks: symbol,
                subscribe: 1
            }));
        }

        // Listen for user changing the market dropdown
        symbolSelect.addEventListener('change', (e) => {
            subscribeToSymbol(e.target.value);
        });

        // Calculate probability logic
        function calculateConfidence(currentDigit) {
            if (tickHistory.length < 5) return 50;
            const occurrences = tickHistory.filter(d => d === currentDigit).length;
            const ratio = occurrences / tickHistory.length;
            return Math.min(Math.round(ratio * 400 + 40), 95);
        }

        // Boot up
        connectWebSocket();
    </script>
</body>
</html>
